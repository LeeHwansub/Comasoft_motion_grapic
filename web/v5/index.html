<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>COMASOFT Intro v5</title>
<link rel="stylesheet" href="intro.css">
</head>
<body>
<section class="intro" aria-label="COMASOFT intro motion">
  <!-- 도형(빛·그라데이션·모션 블러)은 canvas, 가는 선·점은 SVG -->
  <canvas id="fx"></canvas>
  <svg id="lines" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice" aria-hidden="true"></svg>
</section>

<!-- 검토용 컨트롤 (?t= 로 고정 프레임을 볼 때는 숨김) -->
<div class="review" id="review">
  <button id="play" type="button" aria-label="재생/정지">❚❚</button>
  <input id="scrub" type="range" min="0" max="5" step="0.01" value="0" aria-label="타임라인">
  <output id="tc">00:00.00</output>
  <button id="theme" type="button">Light / Dark</button>
</div>
<script src="intro.js"></script>
</body>
</html>

<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>COMASOFT Intro</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@800&display=block" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<svg id="stage" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid meet" aria-label="COMASOFT intro motion">
  <defs>
    <linearGradient id="gBlue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="var(--blue-deep)"/>
      <stop offset="1" stop-color="var(--blue)"/>
    </linearGradient>
    <linearGradient id="gSquare" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="var(--blue)"/>
      <stop offset="1" stop-color="var(--blue-deep)"/>
    </linearGradient>
    <linearGradient id="gSoft" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="var(--blue-light)" stop-opacity="0"/>
      <stop offset="1" stop-color="var(--blue-mid)" stop-opacity=".9"/>
    </linearGradient>
  </defs>

  <rect id="bg" width="1920" height="1080"/>

  <circle id="orbit" class="line" fill="none"/>
  <line id="dotline" x1="0" y1="540" x2="1920" y2="540"/>
  <circle id="soft" fill="url(#gSoft)"/>

  <g id="net" class="line"></g>

  <g id="ghosts"></g>
  <g id="actors">
    <circle id="circle" fill="url(#gBlue)"/>
    <rect id="square" fill="url(#gSquare)"/>
  </g>

  <circle id="spark"/>
  <text id="logo" x="960" y="540" text-anchor="middle" dominant-baseline="central">COMASOFT</text>
</svg>
<script src="motion.js"></script>
</body>
</html>
